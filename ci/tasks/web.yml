---
platform: linux
image_resource:
  type: registry-image
  source: {repository: node, tag: 22.14.0-bookworm-slim}
  version: {digest: "sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b"}
inputs:
  - name: repo
caches:
  - path: repo/web/node_modules
run:
  path: bash
  args:
    - -ceu
    - |
      cd repo/web
      npm ci --ignore-scripts
      npm run lint
      npm run typecheck
      npm test
      npm run build
